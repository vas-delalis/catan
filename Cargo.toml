[package]
name = "catan"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8.1"
enum-map = { version = "2.7.3", features = ["serde"] }
num = "0.4.3"
rand = "0.9.1"
serde = { version = "1.0.217", features = ["derive"] }
tokio = { version = "1.43.0", features = ["macros", "rt-multi-thread"] }
tower = "0.5.2"
tower-http = { version = "0.6.2", features = ["cors"] }
